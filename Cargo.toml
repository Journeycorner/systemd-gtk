[package]
name = "systemd-gtk"
version = "0.1.1"
edition = "2024"

[dependencies]
gtk = { version = "0.10", package = "gtk4", features = ["gnome_48"] }
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
async-channel = { version = "2.5.0", features = [] }
systemctl = { git = "https://github.com/Journeycorner/systemctl", branch = "main", features = [] }
strum = { version = "0.27", features = ["derive"] }

[build-dependencies]
glib-build-tools = "0.21.0"

[profile.release-lto]
inherits = "release"
lto = "fat"
strip = "symbols"
